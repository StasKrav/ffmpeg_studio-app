<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpeg Studio — Профессиональный медиа процессор</title>
    <style>
        /* (стили те же, что были, без изменений) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f1115;
            --bg-secondary: #171a21;
            --bg-card: #171a21;
            --bg-elevated: #232935;
        
            --border-subtle: #2a3038;
        
            --text-primary: #e7ebf2;
            --text-secondary: #98a2b3;
            --text-muted: #6e7787;
        
            --accent: #5b8cff;
            --accent-hover: #79a1ff;
        
            --success: #35c97a;
            --error: #ff6464;
        
            --gradient-start: #5b8cff;
            --gradient-end: #5b8cff;
        }

        body {
            background: var(--bg-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-primary);
            padding: 32px 24px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo h1 {
            font-size: 1rem;
            font-weight: 600;
            background: linear-gradient(135deg, #fff 30%, var(--accent) 80%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        @media (max-width: 768px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--bg-card);
            border-radius: 18px;
            border: 1px solid var(--border-subtle);
            overflow: hidden;
        }

        .card-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .card-header h2 {
            font-size: 0.9rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
        }

        .card-body {
            padding: 24px;
        }

        .upload-zone {
            border: 1.5px dashed var(--border-subtle);
            border-radius: 12px;
            background: var(--bg-secondary);
            padding: 32px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 20px;
        }

        .upload-zone:hover {
            border-color: var(--accent);
            background: rgba(94, 110, 255, 0.08);
        }

        .file-list {
            max-height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-item {
            background: var(--bg-secondary);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-subtle);
            transition: all 0.2s;
        }

        .file-item:hover {
            border-color: var(--accent);
            background: var(--bg-elevated);
        }

        .operation-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 28px;
        }

        @media (max-width: 640px) {
            .operation-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .op-button {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            padding: 10px 6px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .op-button svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
        }

        .op-button:hover {
            background: var(--bg-elevated);
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .op-button.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .param-group {
            margin-bottom: 20px;
        }

        .param-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .param-group select,
        .param-group input {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.85rem;
            color: var(--text-primary);
        }

        .param-group select:focus,
        .param-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .param-group option {
            background: var(--bg-secondary);
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(105deg, var(--gradient-start), var(--gradient-end));
            border: none;
            padding: 12px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .progress-section {
            margin-top: 20px;
            display: none;
        }

        .progress-bar {
            height: 4px;
            background: var(--border-subtle);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
            transition: width 0.2s linear;
        }

        .result-preview {
            margin-top: 16px;
            padding: 16px;
            background: var(--bg-secondary);
            border-radius: 12px;
            display: none;
        }

        .result-preview a {
            color: var(--accent);
            text-decoration: none;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 12px 20px;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success { solid var(--success); }
        .toast.error { solid var(--error); }
        
        .empty-option {
            color: var(--text-muted);
        }

        /* Элегантный появляющийся скролл */
        .file-list {
            max-height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .file-list::-webkit-scrollbar {
            width: 4px;
        }
        
        .file-list::-webkit-scrollbar-track {
            background: transparent;
            border-radius: 10px;
        }
        
        .file-list::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 10px;
            opacity: 0;
            transition: all 0.2s;
        }
        
        .file-list:hover::-webkit-scrollbar-thumb {
            opacity: 1;
        }
        
        .file-list::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
        
        /* Firefox */
        .file-list {
            scrollbar-width: thin;
            scrollbar-color: var(--text-muted) transparent;
        }
        
        .file-list:hover {
            scrollbar-color: var(--accent) transparent;
        }

        .timeline-container {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 16px;
            margin: 16px 0;
            position: relative;
        }
        
        .timeline-canvas {
            width: 100%;
            height: 120px;
            background: #0d0d12;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 12px;
        }
        
        .timeline-controls {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        
        .timeline-controls input {
            flex: 1;
            min-width: 100px;
        }
        
        .time-markers {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-muted);
        }
        
        .preview-video {
            width: 100%;
            max-height: 360px;
            background: #000;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        
        .zoom-control {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .zoom-control button {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        
        .frame-preview {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 8px;
            margin-top: 12px;
        }
        
        .frame-preview img {
            height: 60px;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        
        .frame-preview img:hover {
            border-color: var(--accent);
        }
        
        .trim-buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        
        .trim-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-apply {
            background: var(--success);
            color: white;
        }
        
        .btn-cancel {
            background: var(--bg-elevated);
            color: var(--text-secondary);
        }
        
        .btn-preview {
            background: var(--accent);
            color: white;
        }
        
        .time-input-group {
            display: flex;
            gap: 8px;
            align-items: center;
            background: var(--bg-secondary);
            padding: 8px 12px;
            border-radius: 8px;
        }
        
        .time-input-group input {
            width: 70px;
            text-align: center;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            padding: 4px 8px;
            color: var(--text-primary);
        }

    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">
            <h1>FFmpeg Studio</h1>
            <!-- <p>Профессиональная обработка медиафайлов</p> -->
        </div>
    </div>

    <div class="workspace">
        <div class="card">
            <div class="card-header">
                <h2>Медиафайлы</h2>
            </div>
            <div class="card-body">
                <div class="upload-zone" id="uploadZone">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 16V4M8 8L12 4L16 8"/>
                        <path d="M4 16V18C4 19.1046 4.89543 20 6 20H18C19.1046 20 20 19.1046 20 20V16"/>
                    </svg>
                    <div style="font-weight: 500; margin-top: 8px;">Загрузите файлы</div>
                    <!-- <small style="color: var(--text-muted);">Нажмите или перетащите</small> -->
                    <input type="file" id="fileInput" multiple accept="video/*,audio/*,image/*" style="display: none;">
                </div>
                <div id="fileListContainer" class="file-list"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>Операции</h2>
            </div>
            <div class="card-body">
                <div class="operation-grid" id="operationsGrid"></div>
                <div id="parametersPanel"></div>
                <button class="btn-primary" id="executeBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/>
                    </svg>
                    Выполнить обработку
                </button>
                <div class="progress-section" id="progressSection">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div style="margin-top: 8px; font-size: 0.75rem; color: var(--text-muted); text-align: center;" id="progressText">
                        Ожидание...
                    </div>
                </div>
                <div class="result-preview" id="resultPreview">
                    <strong>✓ Готово!</strong><br>
                    <a href="#" id="downloadLink" download>Скачать результат</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<!-- Модальное окно визуальной обрезки -->
<div id="visualTrimModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 2000; overflow-y: auto;">
    <div style="max-width: 1400px; margin: 20px auto; background: var(--bg-card); border-radius: 18px; padding: 24px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">Визуальный редактор обрезки</h2>
            <button onclick="closeVisualTrim()" style="background: none; border: none; color: var(--text-secondary); font-size: 28px; cursor: pointer;">&times;</button>
        </div>
        
        <!-- Видео превью -->
        <video id="trimPreviewVideo" class="preview-video" controls></video>
        
        <!-- Информация о файле -->
        <div style="display: flex; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px;">
            <div class="time-input-group">
                <span>📹 Файл:</span>
                <span id="trimFileName" style="color: var(--accent);"></span>
            </div>
            <div class="time-input-group">
                <span>⏱ Длительность:</span>
                <span id="trimTotalDuration">0:00</span>
            </div>
            <div class="time-input-group">
                <span>📊 Размер:</span>
                <span id="trimFileSize"></span>
            </div>
        </div>
        
        <!-- Таймлайн -->
        <div class="timeline-container">
            <div class="zoom-control">
                <button onclick="zoomTimeline(-1)">−</button>
                <span style="flex: 1; text-align: center;">Таймлайн</span>
                <button onclick="zoomTimeline(1)">+</button>
            </div>
            <canvas id="timelineCanvas" class="timeline-canvas" width="800" height="120"></canvas>
            <div class="timeline-controls">
                <input type="range" id="trimStartSlider" min="0" max="100" step="0.01" style="flex: 1;">
                <input type="range" id="trimEndSlider" min="0" max="100" step="0.01" style="flex: 1;">
            </div>
            <div class="time-markers">
                <span>◀ Маркер начала</span>
                <span>Маркер конца ▶</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 8px; gap: 12px;">
                <div class="time-input-group">
                    <span>Начало:</span>
                    <input type="text" id="trimStartTime" value="00:00:00" style="width: 100px;">
                </div>
                <div class="time-input-group">
                    <span>Длительность:</span>
                    <input type="text" id="trimDuration" value="00:00:00" style="width: 100px;">
                </div>
                <div class="time-input-group">
                    <span>Конец:</span>
                    <input type="text" id="trimEndTime" value="00:00:00" style="width: 100px;">
                </div>
            </div>
        </div>
        
        <!-- Превью кадров -->
        <div style="margin-top: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span style="font-size: 0.8rem; color: var(--text-secondary);">Ключевые кадры:</span>
                <button onclick="generateThumbnails()" style="background: var(--bg-secondary); border: none; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 0.7rem;">Обновить</button>
            </div>
            <div id="framePreviewContainer" class="frame-preview"></div>
        </div>
        
        <!-- Кнопки действий -->
        <div class="trim-buttons">
            <button class="btn-preview" onclick="previewTrimmedSegment()">▶ Предпросмотр</button>
            <button class="btn-apply" onclick="applyVisualTrim()">✓ Применить обрезку</button>
            <button class="btn-cancel" onclick="closeVisualTrim()">✗ Отмена</button>
        </div>
        
        <div id="trimCommandPreview" style="margin-top: 16px; padding: 12px; background: #0d0d12; border-radius: 8px; font-family: monospace; font-size: 11px; overflow-x: auto;">
            # Команда FFmpeg будет показана здесь
        </div>
    </div>
</div>

<script>
    // Глобальные переменные для визуальной обрезки
    let visualTrimData = {
        file: null,
        fileId: null,
        duration: 0,
        startSec: 0,
        endSec: 0,
        zoom: 1,
        timelineCanvas: null,
        ctx: null,
        audioData: null
    };
    
    // Открыть визуальную обрезку
    // Открыть визуальную обрезку (переименовано)
    async function openVisualTrimTrim() {
        const fileSelect = document.getElementById('param1');
        if (!fileSelect || !fileSelect.value) {
            showToast('Сначала выберите файл', 'error');
            return;
        }
        
        const fileId = fileSelect.value;
        const file = uploadedFiles.find(f => f.id === fileId);
        if (!file) {
            showToast('Файл не найден', 'error');
            return;
        }
        
        visualTrimData.file = file;
        visualTrimData.fileId = fileId;
        visualTrimData.startSec = 0;
        visualTrimData.endSec = 0;
        visualTrimData.zoom = 1;
        
        const modal = document.getElementById('visualTrimModal');
        modal.style.display = 'block';
        
        document.getElementById('trimFileName').textContent = file.originalName;
        document.getElementById('trimFileSize').textContent = formatBytes(file.size);
        
        const video = document.getElementById('trimPreviewVideo');
        video.src = file.url;
        video.load();
        
        video.addEventListener('loadedmetadata', async () => {
            visualTrimData.duration = video.duration;
            visualTrimData.endSec = video.duration;
            
            document.getElementById('trimTotalDuration').textContent = formatTime(video.duration);
            
            const startSlider = document.getElementById('trimStartSlider');
            const endSlider = document.getElementById('trimEndSlider');
            startSlider.max = video.duration;
            endSlider.max = video.duration;
            startSlider.value = 0;
            endSlider.value = video.duration;
            
            updateTrimTimeDisplays();
            initTimeline();
            generateThumbnails();
        });
        
        // Обработчики событий (как были)
        document.getElementById('trimStartSlider').oninput = (e) => {
            visualTrimData.startSec = parseFloat(e.target.value);
            if (visualTrimData.startSec > visualTrimData.endSec) {
                visualTrimData.startSec = visualTrimData.endSec;
                e.target.value = visualTrimData.startSec;
            }
            updateTrimTimeDisplays();
            updateTimelineMarkers();
            updateFFmpegCommand();
            video.currentTime = visualTrimData.startSec;
        };
        
        document.getElementById('trimEndSlider').oninput = (e) => {
            visualTrimData.endSec = parseFloat(e.target.value);
            if (visualTrimData.endSec < visualTrimData.startSec) {
                visualTrimData.endSec = visualTrimData.startSec;
                e.target.value = visualTrimData.endSec;
            }
            updateTrimTimeDisplays();
            updateTimelineMarkers();
            updateFFmpegCommand();
        };
        
        document.getElementById('trimStartTime').onchange = (e) => {
            const sec = timeStringToSeconds(e.target.value);
            if (!isNaN(sec) && sec >= 0 && sec <= visualTrimData.duration) {
                visualTrimData.startSec = Math.min(sec, visualTrimData.endSec);
                document.getElementById('trimStartSlider').value = visualTrimData.startSec;
                updateTrimTimeDisplays();
                updateTimelineMarkers();
                updateFFmpegCommand();
                video.currentTime = visualTrimData.startSec;
            }
        };
        
        document.getElementById('trimEndTime').onchange = (e) => {
            const sec = timeStringToSeconds(e.target.value);
            if (!isNaN(sec) && sec >= 0 && sec <= visualTrimData.duration) {
                visualTrimData.endSec = Math.max(sec, visualTrimData.startSec);
                document.getElementById('trimEndSlider').value = visualTrimData.endSec;
                updateTrimTimeDisplays();
                updateTimelineMarkers();
                updateFFmpegCommand();
            }
        };
        
        updateFFmpegCommand();
    }
    
    // Инициализация таймлайна с реальным анализом аудио
    async function initTimeline() {
        const canvas = document.getElementById('timelineCanvas');
        const ctx = canvas.getContext('2d');
        visualTrimData.timelineCanvas = canvas;
        visualTrimData.ctx = ctx;
        
        // Получаем аудио данные для waveform (требуется CORS)
        const video = document.getElementById('trimPreviewVideo');
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        try {
            // Создаем элемент для анализа аудио
            const track = video.captureStream().getAudioTracks()[0];
            if (track) {
                // Реальный анализ аудио
                const stream = await navigator.mediaDevices.getUserMedia({ audio: false });
                // Упрощённо: генерируем случайную волну (для демо)
                generateDummyWaveform(ctx, canvas.width, canvas.height);
            } else {
                // Нет аудио дорожки
                generateDummyWaveform(ctx, canvas.width, canvas.height);
            }
        } catch (error) {
            console.log('Анализ аудио не доступен, используем визуализацию');
            generateDummyWaveform(ctx, canvas.width, canvas.height);
        }
        
        updateTimelineMarkers();
    }
    
    // Генерация реалистичной волны (симуляция)
    function generateDummyWaveform(ctx, width, height) {
        ctx.fillStyle = '#0d0d12';
        ctx.fillRect(0, 0, width, height);
        
        const barCount = 200;
        const barWidth = width / barCount;
        
        for (let i = 0; i < barCount; i++) {
            // Создаём реалистичную волну с паттерном
            const pattern = Math.sin(i * 0.1) * 0.5 + Math.sin(i * 0.03) * 0.3;
            const heightFactor = 0.3 + pattern * 0.4 + Math.random() * 0.2;
            const barHeight = height * heightFactor;
            const x = i * barWidth;
            const y = (height - barHeight) / 2;
            
            ctx.fillStyle = '#2a2a36';
            ctx.fillRect(x, y, barWidth - 1, barHeight);
        }
    }
    
    // Обновление маркеров на таймлайне
    function updateTimelineMarkers() {
        const canvas = visualTrimData.timelineCanvas;
        const ctx = visualTrimData.ctx;
        if (!ctx) return;
        
        const width = canvas.width;
        const height = canvas.height;
        const duration = visualTrimData.duration;
        
        // Перерисовываем фон
        generateDummyWaveform(ctx, width, height);
        
        // Рисуем область выделения
        const startX = (visualTrimData.startSec / duration) * width;
        const endX = (visualTrimData.endSec / duration) * width;
        
        ctx.fillStyle = 'rgba(94, 110, 255, 0.2)';
        ctx.fillRect(startX, 0, endX - startX, height);
        
        // Рисуем маркеры
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(startX - 2, 0, 4, height);
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(endX - 2, 0, 4, height);
        
        // Рисуем позицию
        const video = document.getElementById('trimPreviewVideo');
        const currentX = (video.currentTime / duration) * width;
        ctx.fillStyle = '#f39c12';
        ctx.fillRect(currentX - 1, 0, 2, height);
    }
    
    // Обновление отображения времени
    function updateTrimTimeDisplays() {
        document.getElementById('trimStartTime').value = formatTime(visualTrimData.startSec);
        document.getElementById('trimEndTime').value = formatTime(visualTrimData.endSec);
        document.getElementById('trimDuration').value = formatTime(visualTrimData.endSec - visualTrimData.startSec);
        document.getElementById('trimStartSlider').value = visualTrimData.startSec;
        document.getElementById('trimEndSlider').value = visualTrimData.endSec;
    }
    
    // Форматирование времени
    function formatTime(seconds) {
        if (isNaN(seconds)) return '00:00:00';
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const secs = Math.floor(seconds % 60);
        return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }
    
    function timeStringToSeconds(timeStr) {
        const parts = timeStr.split(':');
        if (parts.length === 3) {
            return parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + parseInt(parts[2]);
        } else if (parts.length === 2) {
            return parseInt(parts[0]) * 60 + parseInt(parts[1]);
        }
        return parseFloat(timeStr) || 0;
    }
    
    // Предпросмотр выбранного отрезка
    function previewTrimmedSegment() {
        const video = document.getElementById('trimPreviewVideo');
        video.currentTime = visualTrimData.startSec;
        video.play();
        
        // Останавливаем через длительность отрезка
        const duration = visualTrimData.endSec - visualTrimData.startSec;
        setTimeout(() => {
            video.pause();
            video.currentTime = visualTrimData.startSec;
        }, duration * 1000);
    }
    
    // Генерация превью кадров
    function generateThumbnails() {
        const container = document.getElementById('framePreviewContainer');
        container.innerHTML = '';
        
        const numThumbnails = 10;
        const step = visualTrimData.duration / numThumbnails;
        
        for (let i = 0; i <= numThumbnails; i++) {
            const time = i * step;
            const canvas = document.createElement('canvas');
            canvas.width = 80;
            canvas.height = 45;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1a1a24';
            ctx.fillRect(0, 0, 80, 45);
            ctx.fillStyle = '#6e6e86';
            ctx.font = '10px monospace';
            ctx.fillText(formatTime(time), 10, 25);
            
            const img = document.createElement('img');
            img.src = canvas.toDataURL();
            img.title = formatTime(time);
            img.onclick = () => {
                const video = document.getElementById('trimPreviewVideo');
                video.currentTime = time;
                if (time < visualTrimData.startSec) {
                    visualTrimData.startSec = time;
                } else if (time > visualTrimData.endSec) {
                    visualTrimData.endSec = time;
                }
                updateTrimTimeDisplays();
                updateTimelineMarkers();
            };
            container.appendChild(img);
        }
    }
    
    // Обновление команды FFmpeg
    function updateFFmpegCommand() {
        const command = `ffmpeg -i "${visualTrimData.file.originalName}" -ss ${visualTrimData.startSec.toFixed(3)} -t ${(visualTrimData.endSec - visualTrimData.startSec).toFixed(3)} -c copy trimmed_output.mp4`;
        document.getElementById('trimCommandPreview').innerHTML = `<span style="color: #5e6eff;"># FFmpeg команда для обрезки</span>\n${command}`;
    }
    
    // Применить обрезку
    function applyVisualTrim() {
        // Устанавливаем параметры в основную форму обрезки
        const startInput = document.getElementById('startTime');
        const durationInput = document.getElementById('duration');
        const fileSelect = document.getElementById('param1');
        
        if (startInput) startInput.value = visualTrimData.startSec;
        if (durationInput) durationInput.value = visualTrimData.endSec - visualTrimData.startSec;
        if (fileSelect) fileSelect.value = visualTrimData.fileId;
        
        // Переключаемся на вкладку обрезки
        const trimButton = document.querySelector('.op-button[data-op="trim"]');
        if (trimButton) trimButton.click();
        
        closeVisualTrim();
        showToast('Параметры обрезки применены! Нажмите "Выполнить обработку"', 'success');
    }
    
    // Закрыть модальное окно
    function closeVisualTrim() {
        document.getElementById('visualTrimModal').style.display = 'none';
        const video = document.getElementById('trimPreviewVideo');
        video.pause();
        video.src = '';
    }
    
    // Zoom таймлайна
    function zoomTimeline(direction) {
        visualTrimData.zoom = Math.max(0.5, Math.min(3, visualTrimData.zoom + direction * 0.25));
        initTimeline();
    }
    
    // Обновляем маркеры при перемещении видео
    setInterval(() => {
        if (document.getElementById('visualTrimModal').style.display === 'block') {
            updateTimelineMarkers();
        }
    }, 100);
</script>

    function formatBytes(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function renderFileList() {
        const container = document.getElementById('fileListContainer');
        if (!uploadedFiles.length) {
            container.innerHTML = '<div style="text-align: center; padding: 24px; color: var(--text-muted);">Нет загруженных файлов</div>';
            return;
        }
        
        container.innerHTML = uploadedFiles.map(file => `
            <div class="file-item" data-id="${file.id}">
                <div style="display: flex; align-items: center; gap: 10px; overflow: hidden; flex: 1;">

                        <path d="M13 2V9H20"/>

                    <div>

                    </div>
                </div>
                <button class="remove-file" data-id="${file.id}" style="background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; font-size: 16px;">✕</button>
            </div>
        `).join('');
        
        document.querySelectorAll('.remove-file').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const id = btn.dataset.id;
                uploadedFiles = uploadedFiles.filter(f => f.id !== id);
                renderFileList();
                updateParametersUI();
                showToast('Файл удалён', 'info');
            });
        });
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function getFilesByType(type) {
        const typeMap = {
            image: ['jpg','jpeg','png','gif','bmp','webp'],
            video: ['mp4','avi','mkv','mov','webm','flv','m4v','mpg','mpeg'],
            audio: ['mp3','wav','ogg','aac','flac','m4a','opus']
        };
        const extensions = typeMap[type] || [];
        const filtered = uploadedFiles.filter(f => {
            const ext = f.originalName.split('.').pop().toLowerCase();
            return extensions.includes(ext);
        });
        
        if (filtered.length === 0) {
            return '<option value="" disabled selected style="color: var(--text-muted);">— нет доступных файлов —</option>';
        }
        
        return filtered.map(f => `<option value="${f.id}">${escapeHtml(f.originalName)}</option>`).join('');
    }

                                <button type="button" class="btn-primary" onclick="openVisualTrimTrim()" style="background: var(--accent); margin-bottom: 16px;">

                                <div style="border-top: 1px solid var(--border-subtle); margin: 16px 0; padding-top: 16px;">

            `,

                        <option value="video">Видео (со звуком)</option>

    function updateParametersUI() {
        const panel = document.getElementById('parametersPanel');
        if (panel) {
            panel.innerHTML = getParametersHTML();
        }
    }

    async function uploadFiles(files) {
        const formData = new FormData();
        for (const file of files) {
            formData.append('files', file);
        }
        
        try {
            showToast('Загрузка файлов...', 'info');
            const response = await fetch('/api/upload', { method: 'POST', body: formData });
            const data = await response.json();
            if (data.success) {
                const processedFiles = data.files.map(f => ({
                    ...f,
                    id: f.filename.replace(/\.[^/.]+$/, '')
                }));
                uploadedFiles.push(...processedFiles);
                renderFileList();
                updateParametersUI();
                showToast(`Загружено ${data.files.length} файлов`, 'success');
            } else {
                showToast('Ошибка загрузки', 'error');
            }
        } catch (error) {
            console.error('Upload error:', error);
            showToast('Ошибка загрузки файлов', 'error');
        }
    }

    async function executeCommand() {
        if (isProcessing) {
            showToast('Обработка уже выполняется', 'info');
            return;
        }
        
        const params = {};
        const allInputs = document.querySelectorAll('#parametersPanel select, #parametersPanel input');
        allInputs.forEach(el => { 
            params[el.id] = el.value; 
        });
        
        let hasMissingFiles = false;
        let missingFields = [];
        
        if (currentOperation === 'photo-music') {
            if (!params.param1 || params.param1 === '') {
                hasMissingFiles = true;
                missingFields.push('изображение');
            }
            if (!params.param2 || params.param2 === '') {
                hasMissingFiles = true;
                missingFields.push('аудио');
            }
        } else if (currentOperation === 'merge') {
            if (!params.param1 || params.param1 === '') {
                hasMissingFiles = true;
                missingFields.push('файл 1');
            }
            if (!params.param2 || params.param2 === '') {
                hasMissingFiles = true;
                missingFields.push('файл 2');
            }
        } else if (currentOperation !== 'metadata') {
            if (!params.param1 || params.param1 === '') {
                hasMissingFiles = true;
                missingFields.push('исходный файл');
            }
        }
        
        if (hasMissingFiles) {
            showToast(`Пожалуйста, выберите: ${missingFields.join(', ')}`, 'error');
            return;
        }
        
        if (currentOperation !== 'metadata') {
            const requiredIds = [params.param1];
            if (params.param2) requiredIds.push(params.param2);
            
            for (const id of requiredIds) {
                if (!id) continue;
                const found = uploadedFiles.find(f => f.id === id);
                if (!found) {
                    showToast(`Файл не найден. Попробуйте перезагрузить файлы.`, 'error');
                    return;
                }
            }
        }
        
        isProcessing = true;
        const btn = document.getElementById('executeBtn');
        btn.disabled = true;
        
        const progressSection = document.getElementById('progressSection');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const resultPreview = document.getElementById('resultPreview');
        
        progressSection.style.display = 'block';
        resultPreview.style.display = 'none';
        progressFill.style.width = '0%';
        progressText.textContent = 'Обработка...';
        
        let progress = 0;
        const interval = setInterval(() => {
            progress += Math.random() * 10;
            if (progress >= 90) progress = 90;
            progressFill.style.width = `${progress}%`;
        }, 200);
        
        try {
            const requestBody = {
                operation: currentOperation,
                params: params,
                files: uploadedFiles
            };
            
            console.log('Sending request:', requestBody);
            
            const response = await fetch('/api/process', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });
            
            const data = await response.json();
            clearInterval(interval);
            
            if (response.ok && data.success) {
                if (data.isInfo) {
                    progressFill.style.width = '100%';
                    progressText.textContent = 'Информация получена';
                    showToast(`Информация получена`, 'success');
                    setTimeout(() => {
                        progressSection.style.display = 'none';
                    }, 2000);
                } else if (data.outputFile) {
                    progressFill.style.width = '100%';
                    progressText.textContent = 'Готово!';
                    resultPreview.style.display = 'block';
                    const downloadLink = document.getElementById('downloadLink');
                    downloadLink.href = data.outputFile.url;
                    downloadLink.download = data.outputFile.filename;
                    downloadLink.textContent = `Скачать ${data.outputFile.filename}`;
                    showToast('Операция успешно завершена', 'success');
                    setTimeout(() => {
                        progressSection.style.display = 'none';
                    }, 3000);
                }
            } else {
                throw new Error(data.error || 'Ошибка обработки');
            }
        } catch (error) {
            console.error('Process error:', error);
            clearInterval(interval);
            progressFill.style.width = '100%';
            progressText.textContent = 'Ошибка!';
            showToast(error.message, 'error');
            setTimeout(() => {
                progressSection.style.display = 'none';
            }, 2000);
        } finally {
            isProcessing = false;
            btn.disabled = false;
        }
    }
    
    function buildOperationButtons() {
        const container = document.getElementById('operationsGrid');
        container.innerHTML = '';
        OPERATIONS.forEach(op => {
            const btn = document.createElement('button');
            btn.className = `op-button ${currentOperation === op.id ? 'active' : ''}`;
            btn.setAttribute('data-op', op.id);  // <--- ДОБАВИТЬ ЭТУ СТРОКУ
            btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">${op.icon}</svg><span>${op.label}</span>`;
            btn.addEventListener('click', () => {
                document.querySelectorAll('.op-button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentOperation = op.id;
                updateParametersUI();
            });
            container.appendChild(btn);
        });
    }
    
    function setupFileHandlers() {
        const zone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        
        zone.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length) {
                uploadFiles(Array.from(e.target.files));
            }
            fileInput.value = '';
        });
        
        zone.addEventListener('dragover', (e) => { 
            e.preventDefault(); 
            zone.style.borderColor = 'var(--accent)'; 
        });
        
        zone.addEventListener('dragleave', () => { 
            zone.style.borderColor = 'var(--border-subtle)'; 
        });
        
        zone.addEventListener('drop', (e) => {
            e.preventDefault();
            zone.style.borderColor = 'var(--border-subtle)';
            if (e.dataTransfer.files && e.dataTransfer.files.length) {
                uploadFiles(Array.from(e.dataTransfer.files));
            }
        });
    }
    
    // Переключение полей в зависимости от режима обрезки (добавить в конец init или отдельно)
    function setupTrimModeToggle() {
        const trimMode = document.getElementById('trimMode');
        if (!trimMode) return;
        
        const startGroup = document.getElementById('startTimeGroup');
        const durationGroup = document.getElementById('durationGroup');
        const endGroup = document.getElementById('endTimeGroup');
        const cutFromEndGroup = document.getElementById('cutFromEndGroup');
        const fadeType = document.getElementById('fadeType');
        const fadeDurationGroup = document.getElementById('fadeDurationGroup');
        
        trimMode.addEventListener('change', (e) => {
            if (startGroup) startGroup.style.display = 'block';
            if (durationGroup) durationGroup.style.display = 'none';
            if (endGroup) endGroup.style.display = 'none';
            if (cutFromEndGroup) cutFromEndGroup.style.display = 'none';
            
            if (e.target.value === 'start-duration' && durationGroup) {
                durationGroup.style.display = 'block';
            } else if (e.target.value === 'start-end' && endGroup) {
                endGroup.style.display = 'block';
            } else if (e.target.value === 'end-duration') {
                if (startGroup) startGroup.style.display = 'none';
                if (cutFromEndGroup) cutFromEndGroup.style.display = 'block';
            }
        });
        
        if (fadeType && fadeDurationGroup) {
            fadeType.addEventListener('change', (e) => {
                fadeDurationGroup.style.display = e.target.value !== 'none' ? 'block' : 'none';
            });
        }
    }
    
    // Вызвать после updateParametersUI
    function init() {
        buildOperationButtons();
        setupFileHandlers();
        updateParametersUI();
        setupTrimModeToggle();  // <--- ДОБАВИТЬ
        document.getElementById('executeBtn').addEventListener('click', executeCommand);
        showToast('FFmpeg Studio готов к работе', 'success');
    }
    
    init();
</script>
